<!doctype html>
<!--
  Trylo 4-mode webview entry point. Phase 2 stub.

  Phase 2 task 2.2: the actual 14,934-line legacy webview at
  `D:/CC/claude-code-v-2.1.88-main/.../webview-script/` will be
  vendored here at build time by a future `scripts/sync-legacy-4mode.js`.
  For now, this stub proves the iframe can mount, the shim installs
  `acquireVsCodeApi()` against `acquireTryloApi()`, and the 6 simple
  message types round-trip to the host.

  See spike-results/phase-2-plan.md §5.1 for the shim strategy.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self' tauri: ipc: 'unsafe-inline'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" />
    <title>Trylo 4-mode webview</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          Helvetica, Arial, sans-serif;
        background: var(--bg-panel, #1a1a1a);
        color: var(--fg, #e6e6e6);
        font-size: 13px;
      }
      .placeholder {
        padding: 16px;
      }
      .placeholder h1 {
        margin: 0 0 8px 0;
        font-size: 16px;
        font-weight: 600;
      }
      .placeholder p {
        margin: 4px 0;
        line-height: 1.5;
      }
      .placeholder code {
        background: rgba(255, 255, 255, 0.06);
        padding: 1px 4px;
        border-radius: 3px;
        font-size: 12px;
      }
      #messages {
        margin-top: 12px;
        padding: 8px;
        background: rgba(0, 0, 0, 0.18);
        border-radius: 4px;
        max-height: 240px;
        overflow: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
      }
      #messages .row {
        margin: 2px 0;
      }
      #messages .row .type {
        color: #6ea8fe;
      }
    </style>
  </head>
  <body>
    <div class="placeholder">
      <h1>Trylo 4-mode webview — Phase 2 stub</h1>
      <p>
        The legacy <code>acquireVsCodeApi()</code>-based 4-mode webview
        will be vendored here at build time. For now this stub proves
        the iframe can mount, the host can install
        <code>window.acquireTryloApi</code>, and the 6 simple message
        types round-trip.
      </p>
      <p>Sent &amp; received messages (last 20):</p>
      <div id="messages"></div>
    </div>
    <script type="module">
      import { installVsCodeShim } from '/legacy-4mode/trylo-iframe-shim.js';

      const messagesEl = document.getElementById('messages');
      const rows = [];
      const render = () => {
        messagesEl.innerHTML = rows
          .slice(-20)
          .map(
            (r) =>
              `<div class="row"><span class="type">${r}</span></div>`,
          )
          .join('');
      };
      const log = (s) => {
        rows.push(s);
        render();
      };

      const shim = await installVsCodeShim();
      log('shim: installed vscode global');

      window.addEventListener('message', (event) => {
        if (event.source !== window.parent) return;
        log('recv: ' + JSON.stringify(event.data).slice(0, 80));
      });

      // Eagerly call `init` so the host session lifecycle lights up.
      shim.postMessage({ type: 'init' });
      log('send: init');

      // Tiny smoke buttons so a developer can poke the bridge
      // without loading the full legacy UI.
      const btn = document.createElement('button');
      btn.textContent = 'Switch to Agent mode';
      btn.style.cssText = 'margin-top:12px;padding:4px 10px;';
      btn.addEventListener('click', () => {
        shim.postMessage({ type: 'modeChanged', mode: 'agent' });
        log('send: modeChanged agent');
      });
      document.body.appendChild(btn);
    </script>
  </body>
</html>
