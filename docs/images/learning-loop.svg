<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Segoe UI', 'PingFang SC', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8378"/>
    </marker>
  </defs>

  <text x="380" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#26221c">The learning loop</text>

  <!-- pipeline -->
  <rect x="18" y="52" width="160" height="82" rx="10" fill="#ffffff" stroke="#d9d2c2" stroke-width="1.5"/>
  <text x="98" y="82" text-anchor="middle" font-size="13.5" font-weight="700" fill="#26221c">Evidence</text>
  <text x="98" y="102" text-anchor="middle" font-size="10.5" fill="#8a8378">observed behaviour</text>
  <text x="98" y="120" text-anchor="middle" font-size="10" fill="#8a8378">approval · stop · steer · feedback</text>

  <rect x="202" y="52" width="160" height="82" rx="10" fill="#ffffff" stroke="#d9d2c2" stroke-width="1.5"/>
  <text x="282" y="82" text-anchor="middle" font-size="13.5" font-weight="700" fill="#26221c">Conclusion</text>
  <text x="282" y="102" text-anchor="middle" font-size="10.5" fill="#8a8378">induction</text>
  <text x="282" y="120" text-anchor="middle" font-size="10" fill="#8a8378">preferences · corrections</text>

  <rect x="386" y="52" width="160" height="82" rx="10" fill="#ffffff" stroke="#d9d2c2" stroke-width="1.5"/>
  <text x="466" y="82" text-anchor="middle" font-size="13.5" font-weight="700" fill="#26221c">User model</text>
  <text x="466" y="102" text-anchor="middle" font-size="10.5" fill="#8a8378">per user, per project</text>
  <text x="466" y="120" text-anchor="middle" font-size="10" fill="#8a8378">how you actually work</text>

  <rect x="570" y="52" width="172" height="82" rx="10" fill="#211d17"/>
  <text x="656" y="82" text-anchor="middle" font-size="13.5" font-weight="700" fill="#f2c94c">Policy</text>
  <text x="656" y="102" text-anchor="middle" font-size="10.5" fill="#9a927f">enforced / shadow / off</text>
  <text x="656" y="120" text-anchor="middle" font-size="10" fill="#9a927f">drives Code &amp; Work</text>

  <line x1="178" y1="93" x2="198" y2="93" stroke="#8a8378" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="362" y1="93" x2="382" y2="93" stroke="#8a8378" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="546" y1="93" x2="566" y2="93" stroke="#8a8378" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- gates -->
  <text x="380" y="168" text-anchor="middle" font-size="11.5" fill="#8a8378">four gates on the way in — learning has to be earned, not assumed</text>

  <rect x="18" y="186" width="172" height="62" rx="8" fill="#faf8f4" stroke="#e3ddd0"/>
  <text x="104" y="208" text-anchor="middle" font-size="11.5" font-weight="700" fill="#26221c">grounding</text>
  <text x="104" y="226" text-anchor="middle" font-size="10" fill="#8a8378">inferred ≠ evidence</text>
  <text x="104" y="240" text-anchor="middle" font-size="10" fill="#8a8378">evidence-grounding.ts</text>

  <rect x="202" y="186" width="172" height="62" rx="8" fill="#faf8f4" stroke="#e3ddd0"/>
  <text x="288" y="208" text-anchor="middle" font-size="11.5" font-weight="700" fill="#26221c">scoping</text>
  <text x="288" y="226" text-anchor="middle" font-size="10" fill="#8a8378">projects stay separate</text>
  <text x="288" y="240" text-anchor="middle" font-size="10" fill="#8a8378">scope.ts</text>

  <rect x="386" y="186" width="172" height="62" rx="8" fill="#faf8f4" stroke="#e3ddd0"/>
  <text x="472" y="208" text-anchor="middle" font-size="11.5" font-weight="700" fill="#26221c">shadow-first</text>
  <text x="472" y="226" text-anchor="middle" font-size="10" fill="#8a8378">observe before enforcing</text>
  <text x="472" y="240" text-anchor="middle" font-size="10" fill="#8a8378">policy.ts</text>

  <rect x="570" y="186" width="172" height="62" rx="8" fill="#faf8f4" stroke="#e3ddd0"/>
  <text x="656" y="208" text-anchor="middle" font-size="11.5" font-weight="700" fill="#26221c">brake</text>
  <text x="656" y="226" text-anchor="middle" font-size="10" fill="#8a8378">unsettled → don't start</text>
  <text x="656" y="240" text-anchor="middle" font-size="10" fill="#8a8378">impact-check.ts</text>

  <text x="380" y="278" text-anchor="middle" font-size="10.5" fill="#9a927f">runs entirely on your machine — the slower half lives in the desktop-services Node sidecar</text>
</svg>
