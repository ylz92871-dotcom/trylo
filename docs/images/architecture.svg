<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 505" font-family="'Segoe UI', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8378"/>
    </marker>
  </defs>

  <!-- Tauri shell -->
  <rect x="16" y="16" width="928" height="270" rx="14" fill="#faf8f4" stroke="#e3ddd0" stroke-width="1.5"/>
  <rect x="16" y="16" width="928" height="46" rx="14" fill="#211d17"/>
  <rect x="16" y="46" width="928" height="16" fill="#211d17"/>
  <text x="480" y="45" text-anchor="middle" font-size="17" font-weight="700" fill="#f2c94c">Trylo Desktop — Tauri 2 shell (Rust)</text>
  <text x="480" y="75" text-anchor="middle" font-size="11" fill="#9a927f">window · menu · tray · WebView</text>

  <!-- Code sub-app -->
  <rect x="44" y="96" width="270" height="168" rx="10" fill="#ffffff" stroke="#d9d2c2" stroke-width="1.5"/>
  <text x="179" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#26221c">Code sub-app</text>
  <text x="179" y="142" text-anchor="middle" font-size="11" fill="#8a8378">React + Monaco editor</text>
  <line x1="64" y1="154" x2="294" y2="154" stroke="#eee9dd"/>
  <text x="179" y="176" text-anchor="middle" font-size="11.5" fill="#4d463a">IDE: editor · file tree · LSP</text>
  <text x="179" y="196" text-anchor="middle" font-size="11.5" fill="#4d463a">agent chat → trylo-runner</text>
  <text x="179" y="216" text-anchor="middle" font-size="11.5" fill="#4d463a">host-adapter · permission</text>
  <text x="179" y="236" text-anchor="middle" font-size="11.5" fill="#4d463a">result-dock · cognition</text>

  <!-- Work sub-app -->
  <rect x="345" y="96" width="270" height="168" rx="10" fill="#ffffff" stroke="#d9d2c2" stroke-width="1.5"/>
  <text x="480" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#26221c">Work sub-app</text>
  <text x="480" y="142" text-anchor="middle" font-size="11" fill="#8a8378">React renderer</text>
  <line x1="365" y1="154" x2="595" y2="154" stroke="#eee9dd"/>
  <text x="480" y="176" text-anchor="middle" font-size="11.5" fill="#4d463a">documents · sheets · decks · web</text>
  <text x="480" y="196" text-anchor="middle" font-size="11.5" fill="#4d463a">deliverables: docx · xlsx · pptx</text>
  <text x="480" y="216" text-anchor="middle" font-size="11.5" fill="#4d463a">task registry · approval gates</text>
  <text x="480" y="236" text-anchor="middle" font-size="11.5" fill="#4d463a">work-artifact store</text>

  <!-- desktop-services -->
  <rect x="646" y="96" width="270" height="168" rx="10" fill="#ffffff" stroke="#d9d2c2" stroke-width="1.5"/>
  <text x="781" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#26221c">desktop-services</text>
  <text x="781" y="142" text-anchor="middle" font-size="11" fill="#8a8378">Node sidecar</text>
  <line x1="666" y1="154" x2="896" y2="154" stroke="#eee9dd"/>
  <text x="781" y="176" text-anchor="middle" font-size="11.5" fill="#4d463a">service-host loop</text>
  <text x="781" y="196" text-anchor="middle" font-size="11.5" fill="#4d463a">learning loop · user model</text>
  <text x="781" y="216" text-anchor="middle" font-size="11.5" fill="#4d463a">pet-chat · remote gateway</text>
  <text x="781" y="236" text-anchor="middle" font-size="11.5" fill="#4d463a">tool manifests · health</text>

  <!-- trylo-workd under Work -->
  <rect x="345" y="330" width="270" height="118" rx="10" fill="#211d17"/>
  <text x="480" y="358" text-anchor="middle" font-size="13.5" font-weight="700" fill="#f2c94c">trylo-workd</text>
  <text x="480" y="375" text-anchor="middle" font-size="10.5" fill="#9a927f">Node sidecar daemon</text>
  <text x="480" y="398" text-anchor="middle" font-size="11.5" fill="#e8e2d4">control plane (HTTP / WS)</text>
  <text x="480" y="418" text-anchor="middle" font-size="11.5" fill="#e8e2d4">deliverables · host-adapter</text>

  <!-- agent runtime under Code -->
  <rect x="44" y="330" width="270" height="118" rx="10" fill="#ffffff" stroke="#d9d2c2" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="179" y="358" text-anchor="middle" font-size="13.5" font-weight="700" fill="#26221c">Agent runtime</text>
  <text x="179" y="375" text-anchor="middle" font-size="10.5" fill="#8a8378">installed separately — not bundled</text>
  <text x="179" y="398" text-anchor="middle" font-size="11.5" fill="#4d463a">driven via host-adapter</text>
  <text x="179" y="418" text-anchor="middle" font-size="11.5" fill="#4d463a">+ MCP tools (OfficeCLI, …)</text>

  <!-- mobile -->
  <rect x="646" y="330" width="270" height="118" rx="10" fill="#ffffff" stroke="#d9d2c2" stroke-width="1.5"/>
  <text x="781" y="358" text-anchor="middle" font-size="13.5" font-weight="700" fill="#26221c">mobile-app (Android)</text>
  <text x="781" y="375" text-anchor="middle" font-size="10.5" fill="#8a8378">Capacitor shell</text>
  <text x="781" y="398" text-anchor="middle" font-size="11.5" fill="#4d463a">QR pairing → remote gateway</text>
  <text x="781" y="418" text-anchor="middle" font-size="11.5" fill="#4d463a">approve operations from phone</text>

  <!-- arrows -->
  <line x1="179" y1="264" x2="179" y2="326" stroke="#8a8378" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="264" x2="480" y2="326" stroke="#8a8378" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="781" y1="264" x2="781" y2="326" stroke="#8a8378" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="793" y="300" font-size="10" fill="#8a8378">QR pairing</text>

  <!-- bundled resources note -->
  <text x="480" y="484" text-anchor="middle" font-size="10.5" fill="#9a927f">bundled as Tauri resources: desktop-services · work · workd · sidecars (desktop-companion, hermes-capabilities)</text>
</svg>
